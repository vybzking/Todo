
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskManager | Login</title>

    <link rel="stylesheet" href="login.css">

    <script type="module" src="login.js" defer></script>
</head>

<body>

    <main class="login-container">

        <!-- BRAND -->
        <div class="brand">
            <div class="brand-logo">T</div>
            <h2>TaskManager</h2>
        </div>


        <!-- LOGIN CARD -->
        <section class="login-card">

            <div class="login-heading">
                <h1>Welcome back</h1>
                <p>Sign in to continue to your workspace.</p>
            </div>


            <!-- ERROR MESSAGE -->
            <div id="error-message" class="message error" role="alert" hidden></div>

            <div id="success-message" class="message success" role="status" hidden></div>


            <!-- LOGIN FORM -->
            <form id="login-form">

                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <div class="password-label">
                        <label for="password">Password</label>
                    </div>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            class="toggle-password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <button type="submit" id="login-button" class="login-button">
                    Sign In
                </button>

            </form>


            <div class="divider">
                <span>NEW TO TASKMANAGER?</span>
            </div>


            <p class="register-link">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </section>


        <footer>
            <p>TaskManager &copy; 2026. All rights reserved.</p>
        </footer>

    </main>

</body>
</html>
